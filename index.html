  .hint { font-size:.8rem; color:#78909c; margin:4px 0 10px; }

  .legend { font-size:.78rem; color:#546e7a; margin-top:8px; }

  .catrow { display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px solid #eceff1; }

// Gleiche Gemüse-Zutat im Namen erkennen (z. B. „Karottensuppe" ↔ „Paprika-Karotten-Suppe")
function vegTokens(name){
  const STOP = new Set(['suppe','zopp','gemüse','gemuse','mit','und','salat','creme','frischkäse','püree','kompott']);
  return (name.toLowerCase().split(/[^a-zäöüß]+/)).filter(t=>t.length>=5 && !STOP.has(t));
}
function sharesVeg(a,b){
  const ta = vegTokens(a), tb = vegTokens(b);
  for(const x of ta) for(const y of tb) if(x.startsWith(y) || y.startsWith(x)) return true;
  return false;
}

let recording = false;
function startSpeech(targetId, cb){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Sprachinput wird von diesem Browser nicht unterstützt (Chrome/Edge verwenden).'); return; }
  if(recording && window._recog){ window._recog.stop(); return; }
  const r = new SR(); window._recog = r; r.lang = 'de-DE'; r.interimResults = false;
  r.onresult = (e)=>{ document.getElementById(targetId).value = e.results[0][0].transcript.trim(); if(cb) cb(); };
  r.onend = ()=>{ recording=false; if(cb) cb(); };
  r.onerror = ()=>{ recording=false; if(cb) cb(); };
  r.start(); recording = true; if(cb) cb();
}

// ---------- Planner (regelbasiert, erfindet NIE neue Gerichte) ----------
// Kombi-Gericht zusammensetzen: Protein + Beilage + Gemüse, keine Dopplung in der Woche, Kategorien respektieren
function composeCombo(pd, placedInWeek, w, rc){
  const prot = pd.part;
  const okCats = (item)=>{
    for(const r of rc){ if(r.type==='catWeek' && (item.cats||[]).includes(r.params.cat)){
      const used = placedInWeek.filter(x=>x && x.d.cats.includes(r.params.cat)).length;
      if(used >= r.params.max) return false;
    } }
    return true;
  };
  const fecs = (parts.feculon||[]).filter(f=>okCats(f) && !placedInWeek.some(x=>x && x.f && x.f.id===f.id));
  const gems = (parts.gemuese||[]).filter(g=>okCats(g) && !placedInWeek.some(x=>x && x.g && x.g.id===g.id));
  if(!fecs.length || !gems.length) return null;
  const pick = (arr, salt)=> arr[(Math.abs(prot.id)*7 + w*13 + salt*29) % arr.length];
  const f = pick(fecs, 1), g = pick(gems, 2);
  const lbN = (x)=> x.nameLb || '';
  const nameLb = (lbN(prot) && lbN(f) && lbN(g)) ? lbN(prot)+' mat '+lbN(f)+' an '+lbN(g) : '';
  return { d:{ id: pd.id, course:'haupt', combo:true, part:prot,
    name: prot.name + ' mit ' + f.name + ' & ' + g.name, nameLb,
    cats: [...new Set([...(prot.cats||[]), ...(f.cats||[])])], monthly:false, fresh:false, effort: prot.effort||2 }, f, g };
}
function generatePlan(){
  const out = [];
  const N_WEEKS = 13;
  const allPlaced = {};
  // Hauptgericht zuerst planen, damit Vorspeisen-Regeln den Aufwand des Tages kennen
  const PLANNER_ORDER = ['suppe','haupt','vorspeise'];
  for(const c of PLANNER_ORDER){
    const cd = dishes.filter(d=>d.course===c && !d.archived);
    if(cd.length===0 && !(c==='haupt' && (parts.protein||[]).length)) continue;
    // Kombi-Gerichte (Protein + Beilage + Gemüse) nur bei Hauptgerichten
    let comboPool = [];
    if(c==='haupt') for(const p of (parts.protein||[])) comboPool.push({ id:'k'+p.id, course:'haupt', combo:true, part:p, name:p.name, cats:[...(p.cats||[])], monthly:false, fresh:false, effort:p.effort||2 });
    const pool = cd.concat(comboPool);
    const rc = rules.filter(r=>r.course===c);
    const lastUsed = {}, monthCount = {};
    // ⭐-Gerichte gleichmäßig Zielwochen zuweisen (0–3, gestaffelt) statt zufällig – schöne Verteilung übers Monat
    const starWeek = {};
    cd.filter(d=>d.monthly).forEach((d,i)=> starWeek[d.id] = i%4);
    const placed = Array(N_WEEKS*5).fill(null);
    for(let w=0; w<N_WEEKS; w++){
      let placedInWeek = [];
      for(let day=0; day<5; day++){
        const idx = w*5+day;
        // monthlyMust: ⭐-Gerichte, die diesen Monat noch nicht drankamen und deren Zielwoche erreicht ist, werden bevorzugt erzwungen
        let dueIds = null;
        if(rc.some(r=>r.type==='monthlyMust')){
          const m = Math.floor(w/4.34);
          const wkInMonth = Math.min(w - Math.floor(m*4.34), 3);
          dueIds = new Set(pool.filter(d=>d.monthly && !((monthCount[d.id]||{})[m]) && wkInMonth >= (starWeek[d.id] ?? Math.abs(d.id)%4)).map(d=>d.id));
        }
        const candsAll = pool.filter(d=>{
          for(const r of rc){
            const p = r.params;
            if(r.type==='catWeek' && d.cats.includes(p.cat)){
              const used = placedInWeek.filter(x=>x && x.d.cats.includes(p.cat)).length;
              if(used >= p.max) return false;
            }
            if(r.type==='freshDays' && d.fresh && !p.days.includes(day)) return false;
            // Pflicht-⭐: nur begrenzt pro Woche (schöne Verteilung übers Monat)
            if(r.type==='monthlyMust' && d.monthly && placedInWeek.filter(x=>x && x.d.monthly).length >= (r.params.perWeek||1)) return false;
            if(r.type==='perWeek' && placedInWeek.length >= p.max) return false;
            if(r.type==='sameVegWeek' && placedInWeek.some(x=>x && sharesVeg(x.d.name, d.name)) && placedInWeek.filter(x=>x && sharesVeg(x.d.name, d.name)).length >= p.max) return false;
            if(r.type==='courseDepEffort'){ const dep = (allPlaced[p.course]||[])[idx]; if(dep && dep.effort > p.effortMax) return false; }
            if(r.type==='monthly' && d.monthly){
              const m = Math.floor(w/4.34);
              monthCount[d.id] = monthCount[d.id]||{};
              if(monthCount[d.id][m]) return false;
            }
            if(r.type==='minGap' && lastUsed[d.id]!==undefined && (w - Math.floor(lastUsed[d.id]/5)) < p.weeks) return false;
            // Kombi: kein Protein 2× in derselben Woche
            if(d.combo && placedInWeek.some(x=>x && x.d.combo && x.d.part && d.part && x.d.part.id===d.part.id)) return false;
          }
          return true;
        });
        // Bei fälligen Pflicht-⭐-Gerichten: Auswahl darauf beschränken (Fallback, falls durch andere Regeln blockiert)
        let cands = candsAll;
        if(dueIds && dueIds.size){ const dc = candsAll.filter(d=>dueIds.has(d.id)); if(dc.length) cands = dc; }
        // Aufwand-Präferenz als Bewertung
        const scored = cands.map(d=>{
          let s = 0;
          for(const r of rc){ if(r.type==='effortDays' && d.effort===r.params.effort && r.params.days.includes(day)) s += 2;
            if(r.type==='effortDays' && d.effort===r.params.effort && !r.params.days.includes(day)) s -= 2;
            // Kategorie-Mindestmenge aktiv ansteuern (z. B. „Huhn mind. 1× pro Woche")
            if(r.type==='catWeek' && r.params.min>0 && d.cats.includes(r.params.cat)){
              const used = placedInWeek.filter(x=>x && x.d.cats.includes(r.params.cat)).length;
              if(used < r.params.min) s += 3;
            }
          }
          if(placedInWeek.some(p=>p.d.id===d.id)) s -= 5;               // nicht zweimal in derselben Woche
          s += Math.min((lastUsed[d.id]===undefined?999:(idx-lastUsed[d.id]))/7, 6)/6;  // lange nicht verwendet = besser
          if(d.monthly){
            const mr = rc.find(r=>r.type==='monthly');
            if(mr){
              const m = Math.floor(w/4.34);
              const usedThisMonth = (monthCount[d.id]||{})[m];
              if(!usedThisMonth){
                const prefWeek = starWeek[d.id] ?? (Math.abs(d.id) % 4);       // Zielwoche im Monat, verteilt die ⭐-Gerichte
                const wkInMonth = Math.min(w - Math.floor(m*4.34), 3);
                s += wkInMonth >= prefWeek ? 8 : 2;                 // ab Zielwoche stark bevorzugt
              }
            } else s += 1;
          }
          s += ((Math.abs(d.id)*31 + w*17 + day*7) % 100)/1000;          // kleine Streuung, damit Tage/Gerichte variieren
          return { d, s };
        }).sort((a,b)=>b.s-a.s);
        // Festes Gericht an festen Wochentagen (dishDay): überschreibt alle anderen Regeln
        let forced = null;
        for(const r of rc){ const p=r.params; if(r.type==='dishDay' && p.days.includes(day)){ const fd = cd.find(d=>d.name===p.name); if(fd){ forced = fd; break; } } }
        const best = forced ? { d:forced } : scored[0];
        if(best){
          let bd = best.d, cf = null, cg = null;
          if(bd.combo){ const cc = composeCombo(bd, placedInWeek, w, rc); if(!cc){ bd = null; } else { bd = cc.d; cf = cc.f; cg = cc.g; } }
          if(bd){ placedInWeek.push({ d:bd, day, f:cf, g:cg }); lastUsed[bd.id] = idx;
            if(bd.monthly){ const m=Math.floor(w/4.34); monthCount[bd.id]=monthCount[bd.id]||{}; monthCount[bd.id][m]=true; } }
        }
      }
      for(const pe of placedInWeek) placed[w*5+pe.day] = pe.d;    }
    allPlaced[c] = placed;
    out.push({ course:c, days:placed });
  }
  plan = out;
  const warnings = checkPlanConflicts(out, N_WEEKS);
  saveAll(); render();
  if(warnings.length) showWarnings(warnings);
}
// Prüft den fertigen Plan auf Regeln, die sich nicht einhalten ließen
function checkPlanConflicts(out, N_WEEKS){
  const warnings = [];
  for(const o of out){
    const c = o.course, days = o.days;
    const rc = rules.filter(r=>r.course===c);
    // 1) Zu wenige Gerichte platziert („max. pro Woche"-Regeln erzeugen bewusst leere Tage – kein Konflikt)
    const perWeekRule = rc.find(r=>r.type==='perWeek');
    const quota = perWeekRule ? perWeekRule.params.max : 5;
    let shortWeeks = 0, missingTotal = 0;
    for(let w=0; w<N_WEEKS; w++){
      const placedCnt = [0,1,2,3,4].filter(day=>days[w*5+day]).length;
      if(placedCnt < quota){ shortWeeks++; missingTotal += quota - placedCnt; }
    }
    if(shortWeeks) warnings.push(COURSES[c]+': in '+shortWeeks+' Woche(n) konnten zu wenige Gerichte platziert werden ('+missingTotal+' Tag(e) mehr leer als vorgesehen) – zu wenige Gerichte oder Regeln zu streng.');
    // 2) Festes Gericht an festen Tagen nicht eingehalten
    for(const r of rc) if(r.type==='dishDay'){
      let miss = 0;
      (r.params.days||[]).forEach(day=>{ for(let w=0; w<N_WEEKS; w++){ const d = days[w*5+day]; if(!d || d.name!==r.params.name) miss++; } });
      if(miss) warnings.push(COURSES[c]+': Festes Gericht „'+r.params.name+'" fehlt '+miss+'× – Gericht umbenannt, archiviert oder gelöscht?');
    }
    // 3) Pflicht-⭐ nicht in jedem Monat
    if(rc.some(r=>r.type==='monthlyMust')){
      const totalMonths = Math.floor((N_WEEKS-1)/4.34)+1;
      for(const d of dishes.filter(x=>x.course===c && x.monthly && !x.archived)){
        const found = new Set();
        for(let w=0; w<N_WEEKS; w++) for(let day=0; day<5; day++){ const p = days[w*5+day]; if(p && p.id===d.id) found.add(Math.floor(w/4.34)); }
        const miss = totalMonths - found.size;
        if(miss>0) warnings.push(COURSES[c]+': ⭐ „'+d.name+'" fehlt in '+miss+' Monat('+(miss>1?'e':'')+') – zu viele ⭐-Gerichte oder Regeln zu streng.');
      }
    }
    // 4) Kategorie-Mindestmenge pro Woche nicht erreicht
    for(const r of rc) if(r.type==='catWeek' && r.params.min>0){
      let miss = 0;
      for(let w=0; w<N_WEEKS; w++){
        let cnt = 0; for(let day=0; day<5; day++){ const d = days[w*5+day]; if(d && d.cats.includes(r.params.cat)) cnt++; }
        if(cnt < r.params.min) miss++;
      }
      const cl = (cats.find(x=>x.id===r.params.cat)||{}).label || r.params.cat;
      if(miss) warnings.push(COURSES[c]+': Kategorie „'+cl+'" fehlt in '+miss+' Woche(n) – evtl. zu wenige Gerichte dieser Kategorie.');
    }
  }
  return warnings;
}
function showWarnings(warnings){
  const old = document.getElementById('warnbox'); if(old) old.remove();
  const b = document.createElement('div'); b.id = 'warnbox';
  b.innerHTML = `<div class="card"><h2>⚠️ Hinweise zum Plan</h2>
    <div class="hint">Der Plan wurde erstellt, aber folgende Regeln ließen sich nicht vollständig einhalten:</div>

    <div class="actions"><button class="btn" onclick="document.getElementById('warnbox').remove()">Alles klar</button></div></div>`;
  document.body.appendChild(b);
}

}
function addCat(){ const label = prompt('Name der neuen Kategorie:'); if(!label) return;
  const icon = prompt('Symbol (Emoji) für die Kategorie:', '🍽️')||'🍽️';
  cats.push({ id:'c'+Date.now(), label:label.trim(), icon, color:PALETTE[cats.length%PALETTE.length] }); saveAll(); renderDishes(currentDishCourse()); }
function editCat(i){ const c=cats[i]; const label=prompt('Neuer Name:', c.label); if(label===null) return; const icon=prompt('Symbol (Emoji):', c.icon); if(icon===null) return; c.label=label.trim(); c.icon=icon; saveAll(); renderDishes(currentDishCourse()); }
function cycleColor(i){ cats[i].color = PALETTE[(PALETTE.indexOf(cats[i].color)+1)%PALETTE.length]; saveAll(); renderDishes(currentDishCourse()); }
function delCat(i){ const c=cats[i]; const used=dishes.filter(d=>d.cats.includes(c.id));
  if(!confirm('Kategorie „'+c.label+'" löschen? Sie wird von '+used.length+' Gericht(en) entfernt.')) return;
  cats.splice(i,1); dishes.forEach(d=>d.cats=d.cats.filter(x=>x!==c.id)); saveAll(); renderDishes(currentDishCourse()); }

// ---------- Tab: Plan ----------
function getDish(course, w, day){ const pc = plan && plan.find(p=>p.course===course); return pc ? pc.days[w*5+day] : null; }
function dishName(d){
  if(planLang==='lb' && d){ const lb = d.nameLb || LB_NAMES[d.name]; if(lb) return lb; }
  return d ? d.name : '—';
}
function renderPlan(){
  const dn = planLang==='lb'?DAYNAMES_LB:DAYNAMES;
  const dnShort = (i)=> dn[i].slice(0, planLang==='lb'?3:2);
  const ICONS = { suppe:'🍲', vorspeise:'🥗', haupt:'🍽️' };
  app.innerHTML = `
  <div class="card noprint">
    <h2>🗓️ Wochenplan – 3 Monate (13 Wochen)</h2>
    <div class="hint">Der Plan wählt ausschließlich aus deinen eigenen Gerichten. Regeln siehe Tab „Regeln".</div>
    <div class="actions">
      <button class="btn" onclick="generatePlan()">Plan neu erstellen</button>
      <button class="btn secondary" onclick="clearPlan()">Leeren</button>
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="setLang('de')">Deutsch 🇩🇪</button>
      <button class="btn secondary" onclick="setLang('lb')">Lëtzebuergesch 🇱🇺</button>
      <button class="btn secondary" onclick="window.print()">🖨️ Ausdrucken</button>
    </div>
  </div>
  ${!plan ? '<div class="empty">Noch kein Plan erstellt.</div>' : Array.from({length:13},(_,w)=>`
    <div class="card">
      <h2 style="color:#2e7d32">${planLang==='lb'?'Woch':'Woche'} ${w+1}</h2>
      ${DAYNAMES.map((_,day)=>{
        const s = getDish('suppe',w,day), v = getDish('vorspeise',w,day), h = getDish('haupt',w,day);
        return `<div class="daycard">
          <div class="dname">${dnShort(day)}</div>
          <div style="flex:1">
            <div class="dline"><span class="dic">${ICONS.suppe}</span><span>${s?esc(dishName(s)): '—'}${s&&s.monthly?' ⭐':''}</span></div>
            <div class="dline"><span class="dic">${ICONS.vorspeise}</span><span>${v?esc(dishName(v)): '—'}${v&&v.monthly?' ⭐':''}</span></div>
            <div class="dline"><span class="dic">${ICONS.haupt}</span><span>${h?esc(dishName(h)): '—'}${h&&h.monthly?' ⭐':''}</span></div>
          </div>
        </div>`;
      }).join('')}
    </div>`).join('')}
  ${plan?'<div class="legend noprint">Tipp: Leere Stellen bedeuten, dass die Regeln kein passendes Gericht zulassen – Gerichte ergänzen oder Regeln anpassen. Mit ✏️ kannst du einzelne Wochen nicht ändern – der Plan wird immer komplett neu erstellt.</div>':''}`;
}
function setLang(l){ planLang=l; saveAll(); renderPlan(); }
function clearPlan(){ plan=null; saveAll(); renderPlan(); }

// ---------- Tab: Regeln ----------
let addType = 'catWeek';
function renderRules(){
  const section = (course)=>`
    <div class="card">
      <h2>📏 Regeln – ${COURSES[course]}</h2>
      ${rules.filter(r=>r.course===course).map(r=>ruleRow(r)).join('') || '<div class="empty">Keine Regeln.</div>'}
      <div class="actions">
        <select id="addtype-${course}" style="margin:0" onchange="addType=this.value">
          ${Object.entries(RULE_LABELS).map(([k,v])=>`<option value="${k}" ${addType===k?'selected':''}>${v}</option>`).join('')}
        </select>
        <button class="btn secondary" style="flex:none" onclick="addRule('${course}')">＋ Regel</button>
      </div>
    </div>`;
  app.innerHTML = `<div class="card"><h2>📏 Regeln verwalten</h2><div class="hint">Regeln gelten pro Ebene (Suppe / Vorspeise / Hauptgericht). Änderungen werden sofort übernommen; beim Löschen wird nochmal nachgefragt.</div></div>`
    + section('suppe') + section('vorspeise') + section('haupt');
}
function weekdaysPicker(id, sel){ return `<span class="weekday" id="${id}">${DAYNAMES.map((d,i)=>`<span class="chip ${sel.includes(i)?'on':''}" onclick="this.classList.toggle('on')">${d.slice(0,2)}</span>`).join('')}</span>`; }
function ruleRow(r){
  const p = r.params; let params = '';
  if(r.type==='catWeek') params = `<label>Kategorie</label><select onchange="updRule('${r.id}','cat',this.value)">${cats.map(c=>`<option value="${c.id}" ${p.cat===c.id?'selected':''}>${c.icon} ${esc(c.label)}</option>`).join('')}</select>
    <label>min/ Woche</label><input type="number" value="${p.min}" onchange="updRuleNum('${r.id}','min',this.value)">
    <label>max/ Woche</label><input type="number" value="${p.max}" onchange="updRuleNum('${r.id}','max',this.value)">`;
  else if(r.type==='monthly') params = `<label>max. pro Monat</label><input type="number" value="${p.max}" onchange="updRuleNum('${r.id}','max',this.value)">`;
  else if(r.type==='minGap') params = `<label>Wochen Abstand</label><input type="number" value="${p.weeks}" onchange="updRuleNum('${r.id}','weeks',this.value)">`;
  else if(r.type==='freshDays') params = `<label>Tage (Mo–Fr):</label>${weekdaysPicker('wd-'+r.id, p.days)} <button class="btn secondary small" onclick="readDays('${r.id}','freshDays')">OK</button>`;
  else if(r.type==='effortDays') params = `<label>Aufwand</label><select onchange="updRuleNum('${r.id}','effort',this.value)"><option value="1" ${p.effort==1?'selected':''}>wenig</option><option value="2" ${p.effort==2?'selected':''}>mittel</option><option value="3" ${p.effort==3?'selected':''}>viel</option></select>
    <label>Tage:</label>${weekdaysPicker('wd-'+r.id, p.days)} <button class="btn secondary small" onclick="readDays('${r.id}','effortDays')">OK</button>`;
  else if(r.type==='perWeek') params = `<label>max. pro Woche</label><input type="number" value="${p.max}" onchange="updRuleNum('${r.id}','max',this.value)">`;
  else if(r.type==='monthlyMust') params = `<label>max. ⭐ pro Woche</label><input type="number" value="${p.perWeek||1}" onchange="updRuleNum('${r.id}','perWeek',this.value)">`;
  else if(r.type==='sameVegWeek') params = `<label>max. pro Woche</label><input type="number" value="${p.max}" onchange="updRuleNum('${r.id}','max',this.value)">`;
  else if(r.type==='courseDepEffort') params = `<label>Nur wenn</label><select onchange="updRule('${r.id}','course',this.value)">${Object.keys(COURSES).map(k=>`<option value="${k}" ${p.course===k?'selected':''}>${COURSES[k]}</option>`).join('')}</select>
    <label>Aufwand max.</label><select onchange="updRuleNum('${r.id}','effortMax',this.value)"><option value="1" ${p.effortMax==1?'selected':''}>wenig</option><option value="2" ${p.effortMax==2?'selected':''}>mittel</option></select>`;
  else if(r.type==='dishDay') params = `<label>Gericht</label><select onchange="updRule('${r.id}','name',this.value)">${dishes.filter(x=>x.course===r.course && !x.archived).map(x=>`<option value="${esc(x.name)}" ${p.name===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <label>Tage (Mo–Fr):</label>${weekdaysPicker('wd-'+r.id, p.days)} <button class="btn secondary small" onclick="readDays('${r.id}','dishDay')">OK</button>`;
  return `<div class="rule"><div class="rtop"><span class="rlabel">${RULE_LABELS[r.type]}</span>
    <button class="iconbtn" title="Löschen" onclick="delRule('${r.id}')">🗑</button></div><div class="params">${params}</div></div>`;
}
function updRule(id,k,v){ rules.find(r=>r.id===id).params[k]=v; saveAll(); }
function updRuleNum(id,k,v){ updRule(id,k, parseInt(v)||0); }
function readDays(id){ const chips=[...document.getElementById('wd-'+id).querySelectorAll('.chip')]; rules.find(r=>r.id===id).params.days = chips.map((c,i)=>c.classList.contains('on')?i:-1).filter(i=>i>=0); saveAll(); }
function addRule(course){
  const type = document.getElementById('addtype-'+course).value;
  const base = { id:'r'+Date.now(), course, type };
  if(type==='catWeek') base.params={ cat:(cats[0]||{}).id||'', min:1, max:1 };
  else if(type==='monthly') base.params={ max:1 };
  else if(type==='minGap') base.params={ weeks:4 };
  else if(type==='freshDays') base.params={ days:[2,3,4] };
  else if(type==='effortDays') base.params={ effort:3, days:[3,4] };
  else if(type==='perWeek') base.params={ max:2 };
  else if(type==='courseDepEffort') base.params={ course:'haupt', effortMax:2 };
  else if(type==='dishDay') base.params={ name:(dishes.filter(x=>x.course===course && !x.archived)[0]||{}).name||'', days:[4] };
  else if(type==='monthlyMust') base.params={ perWeek:1 };
  else if(type==='sameVegWeek') base.params={ max:1 };
  rules.push(base); saveAll(); renderRules();
}
function delRule(id){ const r=rules.find(x=>x.id===id); if(!confirm('Regel „'+RULE_LABELS[r.type]+'" wirklich löschen?')) return; rules=rules.filter(x=>x.id!==id); saveAll(); renderRules(); }

// ---------- Tab: Sicherung ----------
function renderBackup(){
  app.innerHTML = `
  <div class="card">
    <h2>💾 Sicherheitskopie</h2>
    <div class="hint">Wie bei der Crèche-Küchenhelfer-App: Alle Daten (Kategorien, ${['suppe','vorspeise','haupt'].map(c=>COURSES[c]+'e').join(', ')}, Regeln) als Datei sichern und wiederherstellen. Der erstellte Plan wird mitgesichert.</div>
    <div class="actions"><button class="btn" onclick="exportBackup()">⬇️ Sicherung exportieren</button></div>
    <div class="actions"><button class="btn secondary" onclick="document.getElementById('impfile').click()">⬆️ Sicherung importieren</button></div>
    <input type="file" id="impfile" accept=".json" style="display:none" onchange="importBackup(this)">
    <h3>📋 Datenbestand</h3>
    <div class="hint">Kategorien: ${cats.length} · Suppen: ${dishes.filter(d=>d.course==='suppe'&&!d.archived).length} · Vorspeisen: ${dishes.filter(d=>d.course==='vorspeise'&&!d.archived).length} · Hauptgerichte: ${dishes.filter(d=>d.course==='haupt'&&!d.archived).length} · Archiv „Nicht mehr": ${dishes.filter(d=>d.archived).length} · Regeln: ${rules.length}</div>
    <h3>⚠️ Zurücksetzen</h3>
    <div class="actions"><button class="btn secondary" onclick="resetAll()">Alles löschen & zurücksetzen</button></div>
  </div>`;
}
function exportBackup(){
  const data = JSON.stringify({ version:VERSION, exported:new Date().toISOString(), cats, dishes, rules, parts, plan }, null, 2);
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    a.download = 'menue-planer-sicherung-v'+VERSION+'.json'; a.click();
  } catch(e){ alert('Download in dieser Vorschau blockiert – in der App/PWA funktioniert er. Alternativ:\n\n'+data.slice(0,2000)); }
}
function importBackup(input){
  const f = input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ try {
    const d = JSON.parse(rd.result);
    if(!confirm('Sicherung importieren? Aktuelle Daten werden ersetzt.')) return;
    if(d.cats) cats=d.cats; if(d.dishes) dishes=d.dishes; if(d.rules) rules=d.rules; if(d.parts) parts=d.parts; plan=d.plan||null;
    saveAll(); alert('Import erfolgreich ✓'); render();
  } catch(e){ alert('Datei konnte nicht gelesen werden.'); } };
  rd.readAsText(f);
}
function resetAll(){ if(confirm('Wirklich ALLE Daten löschen und auf Standard zurücksetzen?')){ localStorage.removeItem('mp_cats'); localStorage.removeItem('mp_dishes'); localStorage.removeItem('mp_rules'); localStorage.removeItem('mp_parts'); localStorage.removeItem('mp_plan'); loadAll(); render(); } }

loadAll();
render();
</script>
<script>
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound', ()=>{ const nw = reg.installing; if(nw) nw.addEventListener('statechange', ()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller){ nw.postMessage({type:'SKIP_WAITING'}); } }); });
    });
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!refreshing){ refreshing = true; location.reload(); } });
  }
</script>
</body>
</html>
