  .iconbtn { border:none; background:none; font-size:1.05rem; cursor:pointer; padding:2px 4px; }
  .day { display:flex; gap:10px; padding:8px 10px; border-radius:8px; background:#fff; margin-bottom:5px; box-shadow:0 1px 2px rgba(0,0,0,.06); }

  .day .ddish { flex:1; font-size:.92rem; }
  .day .dsub { font-size:.72rem; color:#78909c; }
  .daycard { display:flex; gap:8px; padding:8px 10px; border-radius:8px; background:#fff; margin-bottom:6px; box-shadow:0 1px 2px rgba(0,0,0,.06); page-break-inside:avoid; }

  .dline { font-size:.9rem; padding:1px 0; display:flex; gap:6px; }
  .dline .dic { flex:none; width:1.3em; text-align:center; }
  .hint { font-size:.8rem; color:#78909c; margin:4px 0 10px; }
  .empty { text-align:center; color:#90a4ae; padding:20px 8px; font-size:.95rem; }
  .legend { font-size:.78rem; color:#546e7a; margin-top:8px; }
  .actions { display:flex; gap:8px; margin-top:8px; }

  .catrow { display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px solid #eceff1; }

  .catdot { width:14px; height:14px; border-radius:50%; flex:none; }
  .rule { background:#fafbfc; border:1px solid #eceff1; border-radius:8px; padding:9px 10px; margin-bottom:7px; font-size:.88rem; }

// ---------- Laden / Speichern ----------
let cats, dishes, rules, plan, planLang = 'de';
function stateToObj(){ return { version:VERSION, cats, dishes, rules }; }
function loadAll(){
  cats = load('mp_cats', DEFAULT_CATS);
  dishes = load('mp_dishes', STARTER_DISHES);
  rules = load('mp_rules', DEFAULT_RULES);
  plan = load('mp_plan', null);
  planLang = load('mp_lang', 'de');
}
function load(k, fb){ try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; } catch(e){ return fb; } }
function saveAll(){
  localStorage.setItem('mp_cats', JSON.stringify(cats));
  localStorage.setItem('mp_dishes', JSON.stringify(dishes));
  localStorage.setItem('mp_rules', JSON.stringify(rules));
  if(plan) localStorage.setItem('mp_plan', JSON.stringify(plan)); else localStorage.removeItem('mp_plan');
  localStorage.setItem('mp_lang', JSON.stringify(planLang));
}

// ---------- Sprachinput ----------
let recording = false;
function startSpeech(targetId, cb){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Sprachinput wird von diesem Browser nicht unterstützt (Chrome/Edge verwenden).'); return; }
  if(recording && window._recog){ window._recog.stop(); return; }
  const r = new SR(); window._recog = r; r.lang = 'de-DE'; r.interimResults = false;
  r.onresult = (e)=>{ document.getElementById(targetId).value = e.results[0][0].transcript.trim(); if(cb) cb(); };
  r.onend = ()=>{ recording=false; if(cb) cb(); };
  r.onerror = ()=>{ recording=false; if(cb) cb(); };
  r.start(); recording = true; if(cb) cb();
}

// ---------- Planner (regelbasiert, erfindet NIE neue Gerichte) ----------
function generatePlan(){
  const out = [];
  const N_WEEKS = 13;
  for(const c of Object.keys(COURSES)){
    const cd = dishes.filter(d=>d.course===c && !d.archived);
    if(cd.length===0) continue;
    const rc = rules.filter(r=>r.course===c);
    const lastUsed = {}, monthCount = {};
    const placed = Array(N_WEEKS*5).fill(null);
    for(let w=0; w<N_WEEKS; w++){
      let placedInWeek = [];
      for(let day=0; day<5; day++){
        const idx = w*5+day;
        const cands = cd.filter(d=>{
          for(const r of rc){
            const p = r.params;
            if(r.type==='catWeek' && d.cats.includes(p.cat)){
              const used = placedInWeek.filter(x=>x && x.d.cats.includes(p.cat)).length;
              if(used >= p.max) return false;
            }
            if(r.type==='freshDays' && d.fresh && !p.days.includes(day)) return false;
            if(r.type==='monthly' && d.monthly){
              const m = Math.floor(w/4.34);
              monthCount[d.id] = monthCount[d.id]||{};
              if(monthCount[d.id][m]) return false;
            }
            if(r.type==='minGap' && lastUsed[d.id]!==undefined && (w - Math.floor(lastUsed[d.id]/5)) < p.weeks) return false;
          }
          return true;
        });
        // Aufwand-Präferenz als Bewertung
        const scored = cands.map(d=>{
          let s = 0;
          for(const r of rc){ if(r.type==='effortDays' && d.effort===r.params.effort && r.params.days.includes(day)) s += 2;
            if(r.type==='effortDays' && d.effort===r.params.effort && !r.params.days.includes(day)) s -= 2; }
          if(d.monthly) s += 1;
          s -= Math.min((lastUsed[d.id]===undefined?999:(idx-lastUsed[d.id]))/7, 6)/6;
          return { d, s };
        }).sort((a,b)=>b.s-a.s);
        const best = scored[0];
        if(best){ placedInWeek.push({ d:best.d, day }); lastUsed[best.d.id] = idx;
          if(best.d.monthly){ const m=Math.floor(w/4.34); monthCount[best.d.id]=monthCount[best.d.id]||{}; monthCount[best.d.id][m]=true; } }
      }
      for(const pe of placedInWeek) placed[w*5+pe.day] = pe.d;
    }
    out.push({ course:c, days:placed });
  }
  plan = out;
  saveAll(); render();
}

function renderRules(){

function weekdaysPicker(id, sel){ return `<span class="weekday" id="${id}">${DAYNAMES.map((d,i)=>`<span class="chip ${sel.includes(i)?'on':''}" onclick="this.classList.toggle('on')">${d.slice(0,2)}</span>`).join('')}</span>`; }
function ruleRow(r){
  const p = r.params; let params = '';
  if(r.type==='catWeek') params = `<label>Kategorie</label><select onchange="updRule('${r.id}','cat',this.value)">${cats.map(c=>`<option value="${c.id}" ${p.cat===c.id?'selected':''}>${c.icon} ${esc(c.label)}</option>`).join('')}</select>
    <label>min/ Woche</label><input type="number" value="${p.min}" onchange="updRuleNum('${r.id}','min',this.value)">
    <label>max/ Woche</label><input type="number" value="${p.max}" onchange="updRuleNum('${r.id}','max',this.value)">`;
  else if(r.type==='monthly') params = `<label>max. pro Monat</label><input type="number" value="${p.max}" onchange="updRuleNum('${r.id}','max',this.value)">`;
  else if(r.type==='minGap') params = `<label>Wochen Abstand</label><input type="number" value="${p.weeks}" onchange="updRuleNum('${r.id}','weeks',this.value)">`;
  else if(r.type==='freshDays') params = `<label>Tage (Mo–Fr):</label>${weekdaysPicker('wd-'+r.id, p.days)} <button class="btn secondary small" onclick="readDays('${r.id}','freshDays')">OK</button>`;
  else if(r.type==='effortDays') params = `<label>Aufwand</label><select onchange="updRuleNum('${r.id}','effort',this.value)"><option value="1" ${p.effort==1?'selected':''}>wenig</option><option value="2" ${p.effort==2?'selected':''}>mittel</option><option value="3" ${p.effort==3?'selected':''}>viel</option></select>
    <label>Tage:</label>${weekdaysPicker('wd-'+r.id, p.days)} <button class="btn secondary small" onclick="readDays('${r.id}','effortDays')">OK</button>`;
  return `<div class="rule"><div class="rtop"><span class="rlabel">${RULE_LABELS[r.type]}</span>
    <button class="iconbtn" title="Löschen" onclick="delRule('${r.id}')">🗑</button></div><div class="params">${params}</div></div>`;
}
function updRule(id,k,v){ rules.find(r=>r.id===id).params[k]=v; saveAll(); }
function updRuleNum(id,k,v){ updRule(id,k, parseInt(v)||0); }
function readDays(id){ const chips=[...document.getElementById('wd-'+id).querySelectorAll('.chip')]; rules.find(r=>r.id===id).params.days = chips.map((c,i)=>c.classList.contains('on')?i:-1).filter(i=>i>=0); saveAll(); }
function addRule(course){
  const type = document.getElementById('addtype-'+course).value;
  const base = { id:'r'+Date.now(), course, type };
  if(type==='catWeek') base.params={ cat:(cats[0]||{}).id||'', min:1, max:1 };
  else if(type==='monthly') base.params={ max:1 };
  else if(type==='minGap') base.params={ weeks:4 };
  else if(type==='freshDays') base.params={ days:[2,3,4] };
  else if(type==='effortDays') base.params={ effort:3, days:[3,4] };
  rules.push(base); saveAll(); renderRules();
}
function delRule(id){ const r=rules.find(x=>x.id===id); if(!confirm('Regel „'+RULE_LABELS[r.type]+'" wirklich löschen?')) return; rules=rules.filter(x=>x.id!==id); saveAll(); renderRules(); }

function exportBackup(){
  const data = JSON.stringify({ version:VERSION, exported:new Date().toISOString(), cats, dishes, rules, plan }, null, 2);
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    a.download = 'menue-planer-sicherung-v'+VERSION+'.json'; a.click();
  } catch(e){ alert('Download in dieser Vorschau blockiert – in der App/PWA funktioniert er. Alternativ:\n\n'+data.slice(0,2000)); }
}
function importBackup(input){
  const f = input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ try {
    const d = JSON.parse(rd.result);
    if(!confirm('Sicherung importieren? Aktuelle Daten werden ersetzt.')) return;
    if(d.cats) cats=d.cats; if(d.dishes) dishes=d.dishes; if(d.rules) rules=d.rules; plan=d.plan||null;
    saveAll(); alert('Import erfolgreich ✓'); render();
  } catch(e){ alert('Datei konnte nicht gelesen werden.'); } };
  rd.readAsText(f);
}
function resetAll(){ if(confirm('Wirklich ALLE Daten löschen und auf Standard zurücksetzen?')){ localStorage.removeItem('mp_cats'); localStorage.removeItem('mp_dishes'); localStorage.removeItem('mp_rules'); localStorage.removeItem('mp_plan'); loadAll(); render(); } }

loadAll();
render();
</script>
<script>
(function(){
  if(!('serviceWorker' in navigator)) return;
  { const v=document.getElementById('ver'); if(v) v.textContent='v'+VERSION; }
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(refreshing) return; refreshing = true; location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing;
      if(nw) nw.addEventListener('statechange', ()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller) nw.postMessage('SKIP_WAITING'); });
    });
  }).catch(()=>{});
})();
</script>
</body>
